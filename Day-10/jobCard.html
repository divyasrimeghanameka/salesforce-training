<template>
    <lightning-card title={job.company} icon-name="standard:work_order">

        <div class="slds-p-around_medium">

            <p>
                <strong>Role:</strong> {job.role}
            </p>

            <p>
                <strong>Package:</strong> {job.package}
            </p>

            <p>
                <strong>Location:</strong> {job.location}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="View Details"
                    onclick={handleViewDetails}
                    class="slds-m-right_small">
                </lightning-button>

                <lightning-button
                    label="Apply"
                    variant="brand"
                    onclick={handleApply}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>
</template>
