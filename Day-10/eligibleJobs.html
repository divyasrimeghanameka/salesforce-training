<template>

    <lightning-card
        title="Eligible Jobs"
        icon-name="standard:work_order">

        <div class="slds-p-around_medium">

            <!-- Job Cards -->
            <template for:each={jobs} for:item="job">

                <div
                    key={job.id}
                    class="slds-m-bottom_medium">

                    <c-job-card
                        job={job}
                        onviewdetails={handleViewDetails}
                        onapply={handleApply}>
                    </c-job-card>

                </div>

            </template>


            <!-- Job Details -->
            <template if:true={selectedJob}>

                <div class="slds-m-top_large">

                    <lightning-card
                        title="Job Details"
                        icon-name="standard:work_order">

                        <div class="slds-p-around_medium">

                            <p class="slds-m-bottom_small">
                                <strong>Company:</strong>
                                {selectedJob.company}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Role:</strong>
                                {selectedJob.role}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Package:</strong>
                                {selectedJob.package}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Location:</strong>
                                {selectedJob.location}
                            </p>

                        </div>

                    </lightning-card>

                </div>

            </template>


            <!-- Success / Already Applied Message -->
            <template if:true={message}>

                <div class="slds-m-top_medium">

                    <lightning-card title="Application Status">

                        <div class="slds-p-around_medium">

                            <p>
                                <strong>{message}</strong>
                            </p>

                        </div>

                    </lightning-card>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
